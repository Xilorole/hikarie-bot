services:
  hikarie-bot:
    image: ${BOT_IMAGE:-ghcr.io/xilorole/hikarie-bot:latest}
    build:
      context: .
      target: bot
    container_name: hikarie-bot-container
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////opt/.db/data.db
    command: ["/opt/.venv/bin/python", "-m", "hikarie_bot", "start", "--skip-db-create"]
    volumes:
      - bot-db:/opt/.db

volumes:
  bot-db:
