name: Ruff

on:
  push:
    branches: [ main, rebuild ]
  pull_request:
    branches: [ main, rebuild ]

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github ."

  format:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Format
        uses: astral-sh/ruff-action@v3
        with:
          args: "format . --check --diff"

