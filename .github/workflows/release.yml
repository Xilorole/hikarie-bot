name: Release

# Build the image of main, check it, and only then push it: a broken image never becomes `latest`.
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TEST_TAG: user/release:test
permissions:
  contents: read
  packages: write
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD/deploy/rancher:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.30.0 /manifests

  build:
    runs-on: ubuntu-latest

    needs: lint
    if: ${{ success() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for the checks
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            APP_REVISION=${{ github.sha }}
          tags: ${{ env.RELEASE_TEST_TAG }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Verify the image
        uses: ./.github/actions/verify-image
        with:
          image: ${{ env.RELEASE_TEST_TAG }}
          revision: ${{ github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # the same build as the checked one: every layer comes from the cache the step above wrote
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
