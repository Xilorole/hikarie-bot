name: Docker Build Test

# Pull requests only: on main, Release builds, checks and pushes the image in one job.
on:
  pull_request:
    branches: [main, rebuild]

env:
  RELEASE_TEST_TAG: user/release:test
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD/deploy/rancher:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.30.0 /manifests

  build_release:
    runs-on: ubuntu-latest

    needs: lint
    if: ${{ success() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            APP_REVISION=${{ github.sha }}
          tags: ${{ env.RELEASE_TEST_TAG }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Verify the image
        uses: ./.github/actions/verify-image
        with:
          image: ${{ env.RELEASE_TEST_TAG }}
          revision: ${{ github.sha }}
