name: Docker Build Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEVCONTAINER_TEST_TAG: user/devcontainer:test
  RELEASE_TEST_TAG: user/release:test
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

      - name: Lint Dev Container Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: .devcontainer/Dockerfile

  build_release:
    runs-on: ubuntu-latest

    needs: lint
    if: ${{ success() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.RELEASE_TEST_TAG }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Verify offline runtime
        run: |
          docker run --rm --network none -e ENV=test \
            --entrypoint /opt/.venv/bin/python \
            "${{ env.RELEASE_TEST_TAG }}" -c \
            'import importlib.util, os; import hikarie_bot, aiohttp, slack_bolt; from dateutil.relativedelta import relativedelta; from sqlalchemy import create_engine, text; assert os.getuid() == 10001; assert importlib.util.find_spec("pytest") is None; assert importlib.util.find_spec("ruff") is None; engine = create_engine("sqlite:////opt/.db/smoke.db"); connection = engine.connect(); connection.execute(text("CREATE TABLE smoke (id INTEGER)")); connection.close(); engine.dispose()'
          docker run --rm --network none -e ENV=test -e SLACK_BOT_TOKEN=xoxb-test \
            "${{ env.RELEASE_TEST_TAG }}" /opt/.venv/bin/python -m hikarie_bot --help

      - name: Build empty initial-data image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: initial-data
          load: true
          tags: user/initial-data:test
          cache-from: type=gha,scope=release

      - name: Verify offline initialization
        run: |
          docker run --rm --network none --entrypoint sh user/initial-data:test -c \
            '/opt/.venv/bin/python -m hikarie_bot.initial_data && /opt/.venv/bin/python -m hikarie_bot.initial_data && /opt/.venv/bin/python -c "import sqlite3; connection = sqlite3.connect(\"/opt/.db/data.db\"); assert connection.execute(\"SELECT COUNT(*) FROM user\").fetchone() == (0,); assert connection.execute(\"SELECT COUNT(*) FROM guest_arrival_raw\").fetchone() == (0,); assert connection.execute(\"SELECT COUNT(*) FROM badges\").fetchone()[0] > 0"'

  build_devcontainer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          load: true
          tags: ${{ env.DEVCONTAINER_TEST_TAG }}
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,scope=devcontainer,mode=max

      - name: Verify development tools as vscode
        run: |
          docker run --rm --network none --user vscode \
            "${{ env.DEVCONTAINER_TEST_TAG }}" sh -c \
            'uv --version && uv python find 3.12 && uv python list --only-installed && hadolint --version && starship --version'
