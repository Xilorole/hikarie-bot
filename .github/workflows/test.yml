name: Test

on:
  push:
    branches: [ main, rebuild ]
  pull_request:
    branches: [ main, rebuild ]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # uv runs the Python pinned in .python-version, like the Dockerfile
      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run Pytest if directory exists
        run: |
          if [ -d "./tests/" ]; then
            uv run pytest -s -n auto
          fi
