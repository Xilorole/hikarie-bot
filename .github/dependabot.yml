version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/"
      - "/.devcontainer"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(rye)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(github-actions)"
