default_stages: [pre-commit]
repos:
  # ruff runs from the project environment, so pyproject.toml pins its version for CI too
  - repo: local
    hooks:
    - id: ruff
      name: Ruff check
      entry: uv run --frozen ruff check --force-exclude --fix
      language: system
      types_or: [python, pyi]

    - id: ruff-format
      name: Ruff format
      entry: uv run --frozen ruff format --force-exclude
      language: system
      types_or: [python, pyi]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint
        name: Lint Dockerfiles
        description: Runs hadolint to lint Dockerfiles
        language: system
        types: ["dockerfile"]
        entry: bash -c 'find . -maxdepth 2 -name "Dockerfile*" | xargs hadolint'
