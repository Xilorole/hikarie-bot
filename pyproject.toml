[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "hikarie_bot"
version = "0.1.0"
description = "hikarie is GOD bot"
authors = [{ name = "Xilorole" }]
requires-python = ">=3.14"
readme = "README.md"


[dependency-groups]
core = [
    "aiohappyeyeballs",
    "aiohttp",
    "asyncclick",
    "click",
    "jpholiday",
    "loguru",
    "pydantic",
    "python-dateutil",
    "slack-bolt",
    "sqlalchemy",
    "tzdata>=2025.2",
    "pydantic-settings>=2.16.2",
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
]
dev = [
    "pytest-asyncio",
    "freezegun",
    "pytest",
    "pytest-xdist",
    "ruff==0.17.4",
    "pyright",
    "pytest-mock",
    "pytest-env",
    "pre-commit-uv>=4.1.4",
    "slack-cli-hooks>=0.3.0",
    "python-dotenv>=1.2.4",
]

[tool.setuptools.packages.find]
exclude = ["build", "tests"]

[tool.setuptools.package-data]
hikarie_bot = ["alembic/*.py", "alembic/*.mako", "alembic/versions/*.py"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_env]
ENV = "test"

[tool.uv]
default-groups = ["core", "dev"]
