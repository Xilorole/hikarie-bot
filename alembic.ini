# For the alembic CLI (e.g. `alembic revision --autogenerate`). The application runs
# migrations itself on startup through hikarie_bot.migrations; the database comes from
# DATABASE_URL (use ENV=dev for a local database).
[alembic]
script_location = %(here)s/hikarie_bot/alembic
file_template = %%(rev)s_%%(slug)s
